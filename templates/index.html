<!DOCTYPE HTML>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Meal Tracker</title>
</head>

<body>
    <main class="layout">
        <header class="hero">
            <h1>moku</h1> <img src="{{ url_for('static', filename='moku_logo.png') }}" width="100" height="100">
        </header>

        <section class="card">
            <h2>Add a Plan</h2>
            <form action="{{ url_for('planner.submit_plan') }}" method="POST">
                <label for="mealname">Meal Name:</label>
                <input type="text" id="mealname" name="meal_name" required>
                <label for="mealdate">Meal Plan Date</label>
                <input type="text" id="mealdate" name="meal_date" required>
                <label for="mealtime">Breakfast, Lunch, or Dinner</label>
                <input type="text" id="mealtime" name="meal_time" required>
                <label for="mealcals">Calories</label>
                <input type="text" id="mealcals" name="meal_calories">
                <input type="submit" value="Create Entry">
            </form>
        </section>

        <section class="card meal_list">
            <h2>Meal List</h2>
            {% if not planned_meals %}
            <p>No meals recorded yet!</p>
            {% else %}
            <ul>
                {% for plan in planned_meals %}
                <li>
                    <form action="{{ url_for('planner.toggle_eaten', plan_id=plan[0]) }}" method="POST" style="display:inline;">
                        <input type="checkbox" name="is_meal_eaten" onchange="this.form.submit()" {% if plan[4] %}checked{% endif %}>
                    </form>
                    <strong>{{ plan[1] }}</strong> planned for {{ plan[2] }} at {{ plan[3] }}
                    <small>(ID: {{ plan[0] }})</small>
                </li>
                {% endfor %}
            </ul>
            {% endif %}
        </section>
    </main>
</body>

</html>
